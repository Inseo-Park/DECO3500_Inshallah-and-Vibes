<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ECHO — UQ Lakes</title>
<style>
/* ==========================================================================
   ECHO — UQ Lakes listening pod prototype
   Single-file build. Open index.html directly; no server required.
   Palette sampled from the film's own title card (see media/ASSETS.md).
   ========================================================================== */

:root{
  --paper:#F4E6CB;
  --paper-deep:#EBD9B8;
  --paper-card:#F7EDD8;
  --ink:#221C17;
  --ink-soft:#5A4C42;
  --maroon:#6E1C20;
  --maroon-lift:#8A2429;
  --rust:#A85C3C;
  --rust-lift:#C9743F;   /* the rust, lifted for use on the dark story stage */
  --tan:#C99B74;
  --hair:rgba(34,28,23,.16);
  --hair-strong:rgba(34,28,23,.30);

  --display:Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;

  --ease:cubic-bezier(.22,.61,.36,1);
  --dur:460ms;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:18px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;margin:0}
[hidden]{display:none!important}

/* --- film grain ---------------------------------------------------------- */
#grain{
  position:fixed;inset:-60%;
  pointer-events:none;z-index:900;
  opacity:.06;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");
  animation:grain 7s steps(8) infinite;
}
@keyframes grain{
  0%{transform:translate(0,0)}      12.5%{transform:translate(-3%,-4%)}
  25%{transform:translate(-6%,2%)}  37.5%{transform:translate(3%,-3%)}
  50%{transform:translate(-2%,5%)}  62.5%{transform:translate(4%,3%)}
  75%{transform:translate(-5%,-2%)} 87.5%{transform:translate(2%,4%)}
  100%{transform:translate(0,0)}
}
/* a soft vignette so the pod screen reads as a recess, not a poster */
#vignette{
  position:fixed;inset:0;pointer-events:none;z-index:899;
  background:radial-gradient(130% 100% at 50% 40%,transparent 48%,rgba(34,28,23,.13) 100%);
}

/* --- screen scaffolding -------------------------------------------------- */
#app{position:fixed;inset:0;z-index:10}
.screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:clamp(28px,4vw,64px);
  padding-top:max(clamp(28px,4vw,64px),env(safe-area-inset-top,0px));
  padding-bottom:max(clamp(28px,4vw,64px),env(safe-area-inset-bottom,0px));
  opacity:0;transform:translateY(14px);
  transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease);
  overflow:hidden;
}
.screen.in{opacity:1;transform:none}
.screen.out{opacity:0;transform:translateY(-10px);pointer-events:none}
.wrap{width:100%;max-width:1060px;margin:0 auto}
.wrap.narrow{max-width:820px}
.wrap.wide{max-width:1280px}

/* stagger children on entry */
.screen.in .stag>*{animation:rise 620ms var(--ease) backwards}
.screen.in .stag>*:nth-child(1){animation-delay:60ms}
.screen.in .stag>*:nth-child(2){animation-delay:150ms}
.screen.in .stag>*:nth-child(3){animation-delay:240ms}
.screen.in .stag>*:nth-child(4){animation-delay:330ms}
.screen.in .stag>*:nth-child(5){animation-delay:420ms}
.screen.in .stag>*:nth-child(6){animation-delay:510ms}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* --- type ---------------------------------------------------------------- */
.eyebrow{
  font-size:.82rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase;
  color:var(--ink-soft);margin:0 0 18px;
}
.eyebrow .dot{color:var(--maroon)}
h1.display{
  font-family:var(--display);
  font-size:clamp(2.8rem,6.6vw,5.4rem);
  line-height:.94;letter-spacing:-.015em;
  text-transform:uppercase;font-weight:700;
  margin:0 0 22px;
}
h1.display.tight{font-size:clamp(2.2rem,4.6vw,3.8rem)}
h2.display{
  font-family:var(--display);
  font-size:clamp(2rem,4.2vw,3.2rem);
  line-height:1.02;letter-spacing:-.01em;
  text-transform:uppercase;font-weight:700;margin:0 0 20px;
}
.lede{font-size:clamp(1.18rem,1.9vw,1.6rem);line-height:1.45;color:var(--ink-soft);margin:0 0 14px;max-width:44ch}
.lede.wide{max-width:60ch}
.lede strong{color:var(--ink);font-weight:600}
.fine{font-size:1.02rem;color:var(--ink-soft);margin:22px 0 0}
.rule{height:1px;background:var(--hair);border:0;margin:30px 0}
.serif-quote{font-family:var(--display);font-size:clamp(1.5rem,2.6vw,2.15rem);line-height:1.28;color:var(--ink);margin:0 0 10px}

/* --- choice cards -------------------------------------------------------- */
.choices{display:grid;gap:16px;margin-top:34px}
.choices.two{grid-template-columns:repeat(2,1fr)}
.choices.three{grid-template-columns:repeat(3,1fr)}
.choices.four{grid-template-columns:repeat(2,1fr)}
.choices.list{grid-template-columns:1fr}
.choices.six{grid-template-columns:repeat(3,1fr)}
@media (max-width:900px){
  .choices.two,.choices.three,.choices.four,.choices.six{grid-template-columns:1fr}
}

.choice{
  position:relative;display:flex;gap:16px;align-items:flex-start;
  min-height:64px;padding:22px 24px;
  background:var(--paper-card);
  border:1px solid var(--hair);
  border-radius:3px;
  text-align:left;cursor:pointer;
  transition:transform 160ms var(--ease),border-color 160ms,background 160ms,box-shadow 160ms;
  box-shadow:0 1px 0 rgba(34,28,23,.05);
}
.choice::after{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--maroon);transform:scaleY(0);transform-origin:top;
  transition:transform 200ms var(--ease);
}
.choice:hover{border-color:var(--hair-strong);transform:translateY(-2px);box-shadow:0 6px 18px rgba(34,28,23,.08)}
.choice:hover::after{transform:scaleY(1)}
.choice:active{transform:translateY(0) scale(.988)}
.choice:focus-visible{outline:3px solid var(--maroon);outline-offset:3px}
.choice .ico{font-size:1.7rem;line-height:1;flex:0 0 auto;margin-top:2px;filter:saturate(.85)}
.choice .txt{flex:1 1 auto;min-width:0}
.choice .t{display:block;font-size:1.22rem;font-weight:650;letter-spacing:.005em;margin-bottom:5px}
.choice .d{display:block;font-size:1.02rem;color:var(--ink-soft);line-height:1.4}
.choice.big{padding:34px 32px;min-height:168px;flex-direction:column;justify-content:center;gap:12px}
.choice.big .ico{font-size:2.4rem}
.choice.big .t{font-family:var(--display);font-size:clamp(1.5rem,2.4vw,2rem);text-transform:uppercase;letter-spacing:.01em;font-weight:700}
.choice.plain{padding:20px 24px}
.choice.plain .t{margin-bottom:0}
.choice.selected{border-color:var(--maroon);background:#F2E2C3}
.choice.selected::after{transform:scaleY(1)}

/* --- buttons ------------------------------------------------------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:12px;
  min-height:64px;padding:0 36px;
  background:var(--maroon);color:var(--paper);
  border:1px solid var(--maroon);border-radius:3px;
  font-size:1.1rem;font-weight:650;letter-spacing:.06em;text-transform:uppercase;
  cursor:pointer;
  transition:transform 150ms var(--ease),background 160ms;
}
.btn:hover{background:var(--maroon-lift)}
.btn:active{transform:scale(.985)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--hair-strong)}
.btn.ghost:hover{background:rgba(34,28,23,.05);border-color:var(--ink)}
.btn.small{min-height:52px;padding:0 24px;font-size:.95rem}
.btnrow{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px;align-items:center}
.btnrow.center{justify-content:center}

/* --- utility bars -------------------------------------------------------- */
.topbar{
  position:absolute;top:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:center;
  padding:clamp(18px,2.2vw,28px) clamp(22px,3vw,40px);
  padding-top:max(clamp(18px,2.2vw,28px),env(safe-area-inset-top,0px));
  z-index:20;pointer-events:none;
}
.topbar>*{pointer-events:auto}
/* The film opens on a pale title card, so the controls need their own ground
   or they vanish into it. */
.screen[data-screen="STORY"] .topbar{
  background:linear-gradient(180deg,rgba(21,17,14,.80),rgba(21,17,14,0));
  padding-bottom:34px;
}
.screen[data-screen="STORY"] .linkbtn{color:var(--paper)!important;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.screen[data-screen="STORY"] .linkbtn:hover{color:#fff!important}
.linkbtn{
  background:none;border:0;padding:20px 22px;margin:-20px -22px;
  min-height:64px;display:inline-flex;align-items:center;
  font-size:.86rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-soft);cursor:pointer;border-radius:3px;
}
.linkbtn:hover{color:var(--maroon)}
.linkbtn:focus-visible{outline:2px solid var(--maroon);outline-offset:2px}
.stamp{
  font-size:.78rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-soft);
}

/* --- text input ---------------------------------------------------------- */
.field{margin-top:26px}
.field label{display:block;font-size:1.05rem;font-weight:600;margin-bottom:12px}
.field textarea,.field input[type=text]{
  width:100%;background:var(--paper-card);
  border:1px solid var(--hair);border-radius:3px;
  padding:18px 20px;font-family:var(--sans);font-size:1.12rem;line-height:1.5;
  color:var(--ink);resize:none;
}
.field textarea::placeholder{color:rgba(90,76,66,.55)}
.field textarea:focus,.field input:focus{outline:0;border-color:var(--maroon);background:#F7EFDD}
.counter{font-size:.92rem;color:var(--ink-soft);margin-top:10px;text-align:right}

/* --- the Person A → Echo → You diagram ----------------------------------- */
.chain{display:flex;align-items:center;justify-content:center;gap:clamp(16px,3vw,40px);margin:38px 0 10px}
.chain .node{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  font-size:.82rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);
}
.chain .node .glyph{
  width:clamp(64px,8vw,92px);height:clamp(64px,8vw,92px);border-radius:50%;
  border:1px solid var(--hair-strong);display:grid;place-items:center;
  font-size:clamp(1.5rem,2.4vw,2rem);background:var(--paper-card);
}
.chain .node.echo .glyph{border-color:var(--maroon);border-width:2px;color:var(--maroon);font-family:var(--display);font-weight:700}
.chain .node.echo{color:var(--maroon)}
.chain .arrow{font-size:1.6rem;color:var(--tan);margin-bottom:22px}
.chain .node.you .glyph{border-style:dashed}

/* pulse rings on the echo node */
.chain .node.echo .glyph{position:relative}
.chain .node.echo .glyph::before,
.chain .node.echo .glyph::after{
  content:"";position:absolute;inset:-6px;border-radius:50%;
  border:1px solid var(--maroon);opacity:0;
  animation:ring 3.4s var(--ease) infinite;
}
.chain .node.echo .glyph::after{animation-delay:1.7s}
@keyframes ring{
  0%{transform:scale(.92);opacity:.5}
  70%{transform:scale(1.5);opacity:0}
  100%{opacity:0}
}

/* --- landing ------------------------------------------------------------- */
#landing-bg{
  position:absolute;inset:0;z-index:-1;
  background:var(--paper);
}
#landing-bg img{
  width:100%;height:100%;object-fit:cover;
  opacity:.22;filter:sepia(.35) contrast(.92);
  transform:scale(1.06);
  animation:driftzoom 40s var(--ease) infinite alternate;
}
#landing-bg::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(244,230,203,.72) 0%,rgba(244,230,203,.86) 55%,rgba(244,230,203,.95) 100%);
}
@keyframes driftzoom{from{transform:scale(1.06) translate(0,0)}to{transform:scale(1.14) translate(-1.5%,-1%)}}

.touchcue{
  margin-top:40px;
  font-size:.86rem;font-weight:700;letter-spacing:.34em;text-transform:uppercase;
  color:var(--maroon);animation:breathe 3.6s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}

/* --- story / player ------------------------------------------------------ */
.stage{position:absolute;inset:0;background:#15110E;display:flex;align-items:center;justify-content:center}
.stage video{width:100%;height:100%;object-fit:contain;background:#15110E}
.stage .stillwrap{position:relative;width:100%;height:100%;overflow:hidden}
.stage .stillwrap img{
  width:100%;height:100%;object-fit:cover;opacity:.5;
  filter:grayscale(1) contrast(1.05);
  transform:scale(1.04);animation:driftzoom 60s var(--ease) infinite alternate;
}
.stage .stillwrap::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(120% 90% at 50% 45%,rgba(21,17,14,.25) 0%,rgba(21,17,14,.86) 100%);
}
.modeb-overlay{
  position:absolute;inset:0;z-index:2;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:clamp(28px,5vw,80px);text-align:center;color:var(--paper);
}
.modeb-overlay .echoid{
  font-size:.86rem;font-weight:700;letter-spacing:.3em;text-transform:uppercase;
  color:var(--tan);margin-bottom:18px;
}
.modeb-overlay .title{
  font-family:var(--display);text-transform:uppercase;font-weight:700;
  font-size:clamp(1.8rem,4vw,3.2rem);line-height:1.02;margin:0 0 26px;max-width:16ch;
}
.era{
  font-size:.92rem;font-weight:700;letter-spacing:.28em;text-transform:uppercase;
  color:var(--paper);opacity:.85;min-height:1.4em;
  transition:opacity 400ms var(--ease);
}
.era.swap{opacity:0}

/* waveform */
#wave{width:min(760px,92%);height:96px;margin:26px 0 6px;cursor:pointer;display:block}

/* transport */
.transport{
  position:absolute;left:0;right:0;bottom:0;z-index:5;
  padding:clamp(20px,3vw,34px) clamp(24px,4vw,56px);
  padding-bottom:max(clamp(20px,3vw,34px),env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,transparent,rgba(21,17,14,.88) 42%);
  color:var(--paper);
  display:flex;flex-direction:column;gap:16px;
  transition:opacity 500ms var(--ease);
}
.transport.idle{opacity:0;pointer-events:none}
.scrub{position:relative;height:44px;display:flex;align-items:center;cursor:pointer}
.scrub .track{position:absolute;left:0;right:0;height:3px;background:rgba(244,230,203,.26);border-radius:2px}
.scrub .fill{position:absolute;left:0;height:3px;background:var(--rust-lift);border-radius:2px;width:0}
.scrub .knob{
  position:absolute;width:14px;height:14px;border-radius:50%;background:var(--paper);
  left:0;transform:translateX(-50%);box-shadow:0 0 0 4px rgba(21,17,14,.5);
  transition:transform 140ms var(--ease);
}
.scrub:hover .knob{transform:translateX(-50%) scale(1.25)}
.scrub .tick{position:absolute;width:1px;height:9px;background:rgba(244,230,203,.42);transform:translateX(-50%)}
.tbar{display:flex;align-items:center;gap:20px}
.tbtn{
  width:64px;height:64px;flex:0 0 auto;border-radius:50%;
  background:var(--paper);color:var(--ink);border:0;cursor:pointer;
  display:grid;place-items:center;font-size:1.3rem;
  transition:transform 150ms var(--ease),background 160ms;
}
.tbtn:hover{background:#fff}
.tbtn:active{transform:scale(.94)}
.tbtn:focus-visible{outline:3px solid var(--rust);outline-offset:3px}
.tbtn.sub{width:52px;height:52px;background:transparent;color:var(--paper);border:1px solid rgba(244,230,203,.4);font-size:1rem}
.tbtn.sub:hover{background:rgba(244,230,203,.14)}
.time{font-variant-numeric:tabular-nums;font-size:1rem;letter-spacing:.06em;color:rgba(244,230,203,.9);min-width:130px}
.tspacer{flex:1 1 auto}
.tlabel{
  font-size:.78rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase;
  color:rgba(244,230,203,.6);
}

/* transcript panel */
#transcript{
  position:absolute;right:0;top:0;bottom:0;width:min(520px,86vw);z-index:8;
  background:var(--paper);border-left:1px solid var(--hair-strong);
  transform:translateX(100%);transition:transform 420ms var(--ease);
  display:flex;flex-direction:column;
}
#transcript.open{transform:none}
/* With the transcript open the stage and its controls give up that space, so
   the player never ends up stranded behind the panel. */
.screen.tr-open .stage,
.screen.tr-open .transport{right:min(520px,86vw)}
.screen .stage,.screen .transport{transition:right 420ms var(--ease)}
#transcript .thead{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:26px 28px 18px;border-bottom:1px solid var(--hair);
}
#transcript .thead h3{margin:0;font-family:var(--display);text-transform:uppercase;font-size:1.3rem;letter-spacing:.02em}
#transcript .tbody{overflow-y:auto;padding:22px 28px 40px;line-height:1.62}
#transcript .tbody h4{
  font-size:.78rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase;
  color:var(--maroon);margin:26px 0 8px;
}
#transcript .tbody h4:first-child{margin-top:0}
#transcript .tbody p{margin:0 0 12px;font-size:1.04rem}
#transcript .note{font-size:.9rem;color:var(--ink-soft);border-top:1px solid var(--hair);padding-top:14px;margin-top:24px}

/* --- media failure notice ------------------------------------------------ */
.mediafail{
  position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:clamp(28px,5vw,72px);background:#15110E;color:var(--paper);
}
.mediafail h3{font-family:var(--display);text-transform:uppercase;font-size:clamp(1.4rem,3vw,2.2rem);margin:0 0 18px}
.mediafail p{max-width:52ch;color:rgba(244,230,203,.78);margin:0 0 14px;font-size:1.05rem;line-height:1.55}
.mediafail code{
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95rem;
  background:rgba(244,230,203,.12);padding:3px 8px;border-radius:3px;color:var(--tan);
}
.mediafail .tree{
  text-align:left;display:inline-block;margin:18px 0 8px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92rem;line-height:1.7;
  color:rgba(244,230,203,.72);border-left:2px solid var(--rust-lift);padding-left:18px;
}

/* --- voice recorder ------------------------------------------------------ */
.recstage{display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:30px}
.recbtn{
  width:132px;height:132px;border-radius:50%;cursor:pointer;
  background:var(--maroon);border:0;color:var(--paper);
  display:grid;place-items:center;gap:6px;
  font-size:.82rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  transition:transform 160ms var(--ease),background 180ms;
  position:relative;
}
.recbtn:hover{background:var(--maroon-lift)}
.recbtn:active{transform:scale(.96)}
.recbtn:focus-visible{outline:3px solid var(--ink);outline-offset:5px}
.recbtn .glyph{font-size:2.1rem;line-height:1}
.recbtn.live{background:var(--ink)}
.recbtn.live::before{
  content:"";position:absolute;inset:-10px;border-radius:50%;
  border:2px solid var(--maroon);animation:ring 2s var(--ease) infinite;
}
#reclevel{width:min(520px,90%);height:72px;display:block}
.rectime{
  font-family:var(--display);font-size:2.4rem;font-variant-numeric:tabular-nums;
  color:var(--ink);line-height:1;
}
.rechint{font-size:1rem;color:var(--ink-soft);text-align:center;max-width:44ch}
.recplayer{
  display:flex;align-items:center;gap:16px;width:min(520px,90%);
  background:var(--paper-card);border:1px solid var(--hair);border-radius:3px;padding:16px 20px;
}
.recplayer audio{width:100%}

/* --- text echo card ------------------------------------------------------ */
.echocard{
  background:var(--paper-card);
  border:1px solid var(--hair);border-radius:3px;
  padding:clamp(32px,4.5vw,56px);
  box-shadow:0 10px 34px rgba(34,28,23,.10);
  position:relative;
}
.echocard::before{
  content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--maroon);
}
.echocard .meta{
  font-size:.8rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:20px;
}
.echocard .meta b{color:var(--maroon)}
.typed{font-family:var(--display);font-size:clamp(1.4rem,2.5vw,2rem);line-height:1.38;margin:0}
.typed .cursor{
  display:inline-block;width:.06em;height:1em;background:var(--maroon);
  vertical-align:-.12em;margin-left:.06em;animation:blink 1s steps(2) infinite;
}
@keyframes blink{50%{opacity:0}}

/* --- echo counter -------------------------------------------------------- */
.counterplate{
  border:1px solid var(--hair-strong);border-radius:3px;
  padding:26px 32px;margin-top:34px;display:inline-block;background:var(--paper-card);

      echo: null,
      time_to_touch_s: null,

      /* Within-subjects: every participant experiences both the film and the
         audio. Which they reach for first is itself a finding. */
      first_medium: null,
      video_seconds: 0, video_pct: 0, video_completed: false,
      video_reaction: null, video_reaction_why: "",
      audio_seconds: 0, audio_pct: 0, audio_completed: false,
      audio_reaction: null, audio_reaction_why: "",
      preferred_medium: null, preferred_why: "",

      takeaway: null, takeaway_why: "",
      echo_type: null, echo_format: null, echo_text: "", echo_audio_seconds: "", echo_left: false,
      last_screen: null,
      path: [],
      events: []
    };
  },
  set(k,v){ if(State.session) State.session[k] = v; },
  event(type, detail){
    if(!State.session) return;
    State.session.events.push({
      t: +((Date.now() - Date.parse(State.session.started))/1000).toFixed(1),
      type: type,
      detail: detail === undefined ? "" : detail
    });
  },
  screen(id){
    if(!State.session) return;
    State.session.path.push(id);
    State.session.last_screen = id;
    this.event("screen", id);
  },
  /* A session is banked the moment it has any substance, and re-banked on
     every later change, so closing the lid mid-test never loses a participant. */
  commit(){
    if(!State.session) return;
    if(State.session.path.length < 2) return;
    State.session.ended = new Date().toISOString();
    const i = Store.mem.findIndex(s => s.id === State.session.id);
    if(i >= 0) Store.mem[i] = State.session; else Store.mem.push(State.session);
    Store.write();
  }
};

const CSV_COLUMNS = [
  "team_progress","team_words","id","started","ended","entry","time_to_touch_s","curiosity","subtopic","echo",
  "first_medium",
  "video_seconds","video_pct","video_completed","video_reaction","video_reaction_why",
  "audio_seconds","audio_pct","audio_completed","audio_reaction","audio_reaction_why",
  "preferred_medium","preferred_why",
  "takeaway","takeaway_why",
  "echo_type","echo_format","echo_text","echo_audio_seconds","echo_left","last_screen","path","clicks"
];

function toCSV(){
  const q = v => {
    if(v === null || v === undefined) v = "";
    if(Array.isArray(v)) v = v.join(" > ");
    v = String(v);
    return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
  };
  const rows = [CSV_COLUMNS.join(",")];
  Store.read().forEach(s => {
    const row = Object.assign({}, s);
    /* every tap, in order, with the time it happened */
    row.clicks = (s.events || [])
      .map(e => e.t + "s " + e.type + (e.detail ? ":" + e.detail : ""))
      .join(" | ");
    rows.push(CSV_COLUMNS.map(c => q(row[c])).join(","));
  });
  return rows.join("\n");
}

function wireQuestion(root, onDone){
  let picked = null;
  root.addEventListener("click", e => {

const app = $("#app");
let current = null;
let currentId = null;

function go(id, payload){
  // Central guards also cover back buttons, direct navigation and tester jumps.
  if(typeof Team !== 'undefined'){
    if(id === 'TEAM_OPEN' && !Team.joined.every(Boolean)) return go('LANDING',payload);
    if(id.startsWith('TEAM_') && id!=='TEAM_OPEN' && !Team.opened) return go('TEAM_OPEN',payload);
    if(id==='TEAM_ANSWER' && !Team.confirmed.every(Boolean)) return go('TEAM_CLUES',payload);
    if(id==='TEAM_LEARN' && Team.solved<=Team.round) return go('TEAM_CLUES',payload);
    if(['TEAM_MAKE','TEAM_REVIEW','TEAM_SEAL','TEAM_DONE'].includes(id) && Team.solved<3) return go('TEAM_CLUES',payload);
    if(id==='TEAM_REVIEW' && !(Team.words.every(w=>w.trim().length>=5)&&Team.strokes.every(s=>s.length))) return go('TEAM_MAKE',payload);
    if(id==='TEAM_SEAL' && !(Team.approvals.every(Boolean)&&Team.recall.every(v=>v==='right'))) return go('TEAM_REVIEW',payload);
    if(id==='TEAM_DONE' && !Team.done) return go('TEAM_SEAL',payload);
    if(id!=='LANDING' && !id.startsWith('TEAM_') && !Team.done) return go(Team.opened?'TEAM_CLUES':'LANDING',payload);
  }
  const def = SCREENS[id];
  if(!def) { console.warn("No screen", id); return; }

  /* Every screen gets the current Echo and medium whether or not the caller
     passed them. Without this, any navigation that doesn't carry a payload —
     a Back button, a jump from the tester panel — throws inside render() and
     silently does nothing, which looks exactly like a dead button. */
  payload = Object.assign({
    id: State.echo || "027",
    medium: State.medium || "video"
  }, payload || {});

  if(current && SCREENS[currentId] && SCREENS[currentId].unmount){
    try{ SCREENS[currentId].unmount(current); }catch(e){}
  }

  const old = current;
  const el = document.createElement("div");
  el.className = "screen";
  el.dataset.screen = id;
  try{
    el.innerHTML = def.render(payload);
  }catch(err){
    console.error("Screen failed to render:", id, err);
    el.innerHTML = topbar({})+
      '<div class="wrap narrow" style="text-align:center">'+
        '<h2 class="display">Something went wrong</h2>'+
        '<p class="lede" style="margin:0 auto">That screen couldn\'t open. Tap below to go back to the start.</p>'+
        '<div class="btnrow center"><button class="btn" data-act="restart-hard">Start over</button></div>'+
      '</div>';
  }
  app.appendChild(el);

  void el.offsetWidth;              /* force reflow so the transition runs */
  el.classList.add("in");
  if(old){
    old.classList.add("out");
    setTimeout(() => old.remove(), reduceMotion() ? 10 : 520);
  }

  current = el;
  currentId = id;
  State.screen = id;
  Log.screen(id);
  Log.commit();

  if(def.mount) def.mount(el, payload);

  const h = el.querySelector("h1,h2,.pulse");
  if(h){ h.setAttribute("tabindex","-1"); }
}

let resetArmed = false;
app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if(!b) return;
  const act = b.dataset.act, val = b.dataset.val;

  if(act === "go"){ go(val); }
  else if(act === "back"){ go(val); }
  else if(act === "restart-hard"){ restart(); }
  else if(act === "reset"){
    if(!resetArmed){
      resetArmed = true;
      b.textContent = "Tap again to reset";
      b.style.color = "var(--maroon)";
      setTimeout(() => {
        resetArmed = false;
        if(document.body.contains(b)){ b.textContent = "Start over"; b.style.color = ""; }
      }, 3000);
    } else {
      resetArmed = false;
      restart();
    }
  }
});

document.addEventListener("keydown", e => {
  if(e.key === "Escape" && $("#transcript.open")) toggleTranscript(false);
  if((e.metaKey||e.ctrlKey) && e.shiftKey && (e.key === "D" || e.key === "d")){
    e.preventDefault(); Dev.toggle();
  }
});

function restart(){
  Log.event("reset");
  Player.bankProgress();      /* capture the drop-off before the session rolls */
  Log.commit();
  Log.begin();
  State.echo = null;
  State.draft = {type:null, format:null, text:"", audioUrl:null, audioSecs:0};
  State.medium = null;
  State.seen = {video:false, audio:false};
  go("LANDING");
}

/* ==========================================================================
   6. PLAYER
   ========================================================================== */

const Player = {
  media:null, env:null, canvas:null, raf:null, timers:[], ro:null,
  idle:null, seeking:false, maxTime:0, root:null, era:null, lastEra:-1, sessionId:null,

  init(root, payload){
    this.root = root;
    this.maxTime = 0; this.lastEra = -1;
    this.sessionId = State.session ? State.session.id : null;
    this.medium = (payload && payload.medium) || State.medium || "video";
    const media = this.media = $("#media", root);
    if(!media) return;

    this.env = (State.medium === "video" ? ENVELOPES.video : ENVELOPES.audio)
      .split(",").map(Number);
    this.canvas = $("#wave", root);
    this.era = $("#era", root);

    const playbtn = $("#playbtn", root),
          backbtn = $("#backbtn", root),
          ccbtn   = $("#ccbtn", root),
          donebtn = $("#donebtn", root),
          scrub   = $("#scrub", root),
          fill    = $("#fill", root),
          knob    = $("#knob", root),
          timeEl  = $("#time", root),
          transport = $("#transport", root);

    const setPlayIcon = () => {
      playbtn.innerHTML = media.paused ? "&#9658;" : "&#10074;&#10074;";
      playbtn.setAttribute("aria-label", media.paused ? "Play" : "Pause");
    };

    const paint = () => {
      const d = media.duration || 0, t = media.currentTime || 0;
      if(t > this.maxTime) this.maxTime = t;
      const p = d ? t/d : 0;
      fill.style.width = (p*100)+"%";
      knob.style.left  = (p*100)+"%";
      timeEl.textContent = fmt(t) + " / " + fmt(d);
      scrub.setAttribute("aria-valuetext", fmt(t)+" of "+fmt(d));
      this.updateEra(p);
      if(this.canvas) this.drawWave(p);
    };

    const loop = () => { paint(); this.raf = requestAnimationFrame(loop); };

    media.addEventListener("loadedmetadata", () => {
      this.loaded = true;
      this.renderTicks(root);
      paint();
    });

    /* If the media folder isn't sitting next to index.html the browser fails
       silently — a black rectangle and no explanation. Say what's wrong. */
    this.loaded = false;
    const fail = () => this.showMediaFailure(root, media.currentSrc ||
      (State.medium === "video" ? ECHOES[payload.id].video : ECHOES[payload.id].audio));
    media.addEventListener("error", fail);
    const srcEl = media.querySelector("source");
    if(srcEl) srcEl.addEventListener("error", fail);
    this.timers.push(setTimeout(() => {
      if(!this.loaded && this.media && this.media.readyState === 0) fail();
    }, 6000));
    media.addEventListener("play",  () => { setPlayIcon(); Log.event("play", fmt(media.currentTime)); this.armIdle(transport); });
    media.addEventListener("pause", () => { setPlayIcon(); Log.event("pause", fmt(media.currentTime)); this.showTransport(transport); });
    media.addEventListener("ended", () => {
      Log.set(this.medium + "_completed", true);
      Log.event("ended", this.medium);
      this.finish();
    });

    playbtn.addEventListener("click", () => {
      if(media.paused) media.play().catch(() => {}); else media.pause();
    });
    backbtn.addEventListener("click", () => {
      media.currentTime = Math.max(0, media.currentTime - 15);
      Log.event("back15", fmt(media.currentTime));
    });
    ccbtn.addEventListener("click", () => toggleTranscript());
    donebtn.addEventListener("click", () => { Log.event("stopped_early", fmt(media.currentTime)); this.finish(); });

    root.addEventListener("click", e => {
      if(e.target.closest('[data-act="cc-close"]')) toggleTranscript(false);
    });

    /* scrubbing */
    const seekAt = clientX => {
      const r = scrub.getBoundingClientRect();
      const p = Math.min(1, Math.max(0, (clientX - r.left)/r.width));
      if(media.duration) media.currentTime = p * media.duration;
      paint();
    };
    scrub.addEventListener("pointerdown", e => {
      this.seeking = true; scrub.setPointerCapture(e.pointerId); seekAt(e.clientX);
    });
    scrub.addEventListener("pointermove", e => { if(this.seeking) seekAt(e.clientX); });
    scrub.addEventListener("pointerup",   e => {
      if(this.seeking) Log.event("seek", fmt(media.currentTime));
      this.seeking = false;
    });
    scrub.addEventListener("keydown", e => {
      if(e.key === "ArrowRight"){ media.currentTime += 10; paint(); }
      if(e.key === "ArrowLeft"){ media.currentTime -= 10; paint(); }
    });
    if(this.canvas){
      this.canvas.addEventListener("click", e => {
        const r = this.canvas.getBoundingClientRect();
        const p = Math.min(1, Math.max(0, (e.clientX - r.left)/r.width));
        if(media.duration) media.currentTime = p * media.duration;
        Log.event("seek_wave", fmt(media.currentTime));
        paint();
      });
    }

    /* Mode A hides its chrome so the film can breathe; Mode B keeps it. */
    if(State.medium === "video"){
      root.addEventListener("pointermove", () => this.showTransport(transport));
      root.addEventListener("pointerdown", () => this.showTransport(transport));
    }

    window.addEventListener("resize", this.onResize = () => { if(this.canvas) this.drawWave(); });
    if(this.canvas && window.ResizeObserver){
      this.ro = new ResizeObserver(() => this.drawWave());
      this.ro.observe(this.canvas);
    }

    setPlayIcon();
    loop();
    media.play().then(setPlayIcon).catch(() => {
      /* autoplay refused — the big play button is right there */
      setPlayIcon(); this.showTransport(transport);
    });
  },

  showMediaFailure(root, src){
    if($(".mediafail", root)) return;
    Log.event("media_failed", src || "");
    const file = (src || "").split("/").pop() || "the media file";
    const wanted = State.medium === "video" ? "echo-027-video.mp4" : "echo-027-audio.mp3";
    const box = document.createElement("div");
    box.className = "mediafail";
    box.innerHTML =
      "<h3>The Echo can't find its recording</h3>"+
      "<p>The browser couldn't load <code>"+esc(file)+"</code>. Nine times out of ten this means "+
      "<code>index.html</code> has been opened on its own, without the <code>media</code> folder beside it.</p>"+
      '<div class="tree">ECHO/<br>&nbsp;&nbsp;index.html<br>&nbsp;&nbsp;media/<br>'+
      '&nbsp;&nbsp;&nbsp;&nbsp;'+esc(wanted)+'<br>&nbsp;&nbsp;&nbsp;&nbsp;&hellip;</div>'+
      "<p>Keep the whole ECHO folder together and open <code>index.html</code> from inside it.</p>"+
      '<div class="btnrow center"><button class="btn" data-act="back" data-val="ECHO_INTRO">Go back</button></div>';
    root.appendChild(box);
    const t = $("#transport", root);
    if(t) t.classList.add("idle");
  },

  renderTicks(root){
    const box = $("#ticks", root);
    if(!box) return;
    box.innerHTML = CHAPTERS.map(c =>
      c.at > 0 ? '<div class="tick" style="left:'+(c.at*100)+'%"></div>' : ""
    ).join("");
  },

  updateEra(p){
    if(!this.era) return;
    let idx = 0;
    for(let i = 0; i < CHAPTERS.length; i++) if(p >= CHAPTERS[i].at) idx = i;
    if(idx === this.lastEra) return;
    this.lastEra = idx;
    this.era.classList.add("swap");
    setTimeout(() => {
      this.era.textContent = CHAPTERS[idx].label;
      this.era.classList.remove("swap");
    }, reduceMotion() ? 0 : 340);
  },

  drawWave(progress){
    const c = this.canvas; if(!c) return;
    const w = c.clientWidth, h = c.clientHeight;
    if(!w || !h) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    if(c.width !== Math.round(w*dpr)){ c.width = Math.round(w*dpr); c.height = Math.round(h*dpr); }
    const ctx = c.getContext("2d");
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);

    const barW = 3, gap = 3;
    const n = Math.max(8, Math.floor((w + gap)/(barW + gap)));
    const bars = resample(this.env, n);
    const p = progress !== undefined ? progress
      : (this.media && this.media.duration ? this.media.currentTime/this.media.duration : 0);
    const mid = h/2;
    for(let i = 0; i < n; i++){
      const bh = Math.max(2, (bars[i]/100) * (h - 8));
      const played = (i/n) <= p;
      ctx.fillStyle = played ? "#D98B4A" : "rgba(244,230,203,.24)";
      ctx.fillRect(i*(barW+gap), mid - bh/2, barW, bh);
    }
  },

  showTransport(t){
    if(!t) return;
    t.classList.remove("idle");
    this.armIdle(t);
  },
  armIdle(t){
    if(State.medium !== "video" || !t) return;
    clearTimeout(this.idle);
    this.idle = setTimeout(() => {
      if(this.media && !this.media.paused && !$("#transcript.open")) t.classList.add("idle");
    }, 3400);
  },

  /* Banked both on a clean finish and on abandonment, because how far a
     participant got before walking away is the drop-off measure. */
  bankProgress(){
    const m = this.media;
    if(!m) return;
    /* Only ever write back into the session that actually watched this
       playback — a reset or a mode switch opens a new one, and playback
       figures must not leak forward into it. */
    if(!State.session || State.session.id !== this.sessionId) return;
    const k = this.medium || State.medium || "video";
    Log.set(k + "_seconds", +this.maxTime.toFixed(1));
    Log.set(k + "_pct", m.duration ? +((this.maxTime/m.duration)*100).toFixed(1) : 0);
    Log.commit();
  },

  finish(){
    this.bankProgress();
    if(this.media) this.media.pause();
    toggleTranscript(false);
    const k = this.medium || State.medium;
    State.seen[k] = true;
    go("REACTION", {medium:k});
  },

  destroy(){
    this.bankProgress();
    cancelAnimationFrame(this.raf);
    clearTimeout(this.idle);
    this.timers.forEach(t => { clearTimeout(t); clearInterval(t); });
    this.timers = [];
    if(this.onResize) window.removeEventListener("resize", this.onResize);
    if(this.ro){ this.ro.disconnect(); this.ro = null; }
    if(this.media){ try{ this.media.pause(); this.media.removeAttribute("src"); this.media.load(); }catch(e){} }
    this.media = null; this.canvas = null; this.era = null;
  }
};

/* ==========================================================================
   6b. VOICE RECORDER
   Recordings are held in memory for the session and downloaded from the
   tester panel. Nothing is uploaded — there is no backend (§44).
   ========================================================================== */

const RECORDINGS = [];
const MAX_REC_SECONDS = 60;

const Rec = {
  root:null, stream:null, mr:null, chunks:[], blob:null, url:null,
  secs:0, tick:null, raf:null, ac:null, analyser:null, data:null, t0:0,

  mount(root){
    this.root = root;
    this.reset();
    const btn = $("#recbtn", root);

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
      this.unsupported("This browser can't record audio here.");
      return;
    }

    btn.addEventListener("click", () => {
      if(this.mr && this.mr.state === "recording") this.stop();
      else this.start();
    });

    root.addEventListener("click", e => {
      const b = e.target.closest("[data-act]");
      if(!b) return;
      if(b.dataset.act === "use"){
        State.draft.audioUrl = this.url;
        State.draft.audioSecs = this.secs;
        Log.set("echo_audio_seconds", +this.secs.toFixed(1));
        Log.event("recording_kept", this.secs.toFixed(1) + "s");
        go("CONFIRM");
      }
      if(b.dataset.act === "again"){
        Log.event("recording_redo");
        this.reset();
        $("#recreview", root).hidden = true;
        $("#recstage", root).hidden = false;
      }
    });
  },

  async start(){
    const root = this.root;
    try{
      this.stream = await navigator.mediaDevices.getUserMedia({audio:true});
    }catch(err){
      Log.event("mic_denied", err && err.name);
      this.unsupported(
        err && err.name === "NotAllowedError"
          ? "The microphone wasn't allowed, so recording can't start."
          : "The microphone isn't available on this device."
      );
      return;
    }

    let mime = "";
    ["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus"].forEach(m => {
      if(!mime && window.MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) mime = m;
    });

    this.chunks = [];
    this.mr = mime ? new MediaRecorder(this.stream, {mimeType:mime}) : new MediaRecorder(this.stream);
    this.mr.ondataavailable = e => { if(e.data && e.data.size) this.chunks.push(e.data); };
    this.mr.onstop = () => this.finalise();
    this.mr.start();
    this.t0 = Date.now();
    Log.event("recording_started");

    const btn = $("#recbtn", root);
    btn.classList.add("live");
    $("#reclabel", root).textContent = "Stop";
    btn.querySelector(".glyph").innerHTML = "&#9632;";
    $("#rectime", root).hidden = false;
    $("#reclevel", root).hidden = false;
    $("#rechint", root).textContent = "Speak whenever you're ready. Tap again to stop.";

    this.tick = setInterval(() => {
      this.secs = (Date.now() - this.t0)/1000;
      $("#rectime", root).textContent = fmt(this.secs);
      if(this.secs >= MAX_REC_SECONDS) this.stop();
    }, 200);

    /* A live meter from the microphone stream — this one is a real analyser,
       because a MediaStream is not subject to the file:// media restriction. */
    try{
      this.ac = new (window.AudioContext || window.webkitAudioContext)();
      const src = this.ac.createMediaStreamSource(this.stream);
      this.analyser = this.ac.createAnalyser();
      this.analyser.fftSize = 1024;
      this.data = new Uint8Array(this.analyser.frequencyBinCount);
      src.connect(this.analyser);
      this.history = [];
      this.drawLevel();
    }catch(e){ /* meter is decorative; recording continues without it */ }
  },

  drawLevel(){
    const c = $("#reclevel", this.root);
    if(!c || !this.analyser) return;
    const w = c.clientWidth, h = c.clientHeight;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    if(c.width !== Math.round(w*dpr)){ c.width = Math.round(w*dpr); c.height = Math.round(h*dpr); }
    const ctx = c.getContext("2d");
    ctx.setTransform(dpr,0,0,dpr,0,0);

    this.analyser.getByteTimeDomainData(this.data);
    let peak = 0;
    for(let i = 0; i < this.data.length; i++){
      const v = Math.abs(this.data[i] - 128)/128;
      if(v > peak) peak = v;
    }
    this.history.push(peak);
    const barW = 3, gap = 2, n = Math.floor((w + gap)/(barW + gap));
    if(this.history.length > n) this.history.shift();

    ctx.clearRect(0,0,w,h);
    const mid = h/2;
    this.history.forEach((v, i) => {
      const bh = Math.max(2, Math.pow(v, .7) * (h - 8));
      ctx.fillStyle = "#6E1C20";
      ctx.fillRect(i*(barW+gap), mid - bh/2, barW, bh);
    });
    this.raf = requestAnimationFrame(() => this.drawLevel());
  },

  stop(){
    if(this.mr && this.mr.state === "recording") this.mr.stop();
    clearInterval(this.tick);
    cancelAnimationFrame(this.raf);
  },

  finalise(){
    const root = this.root;
    this.secs = (Date.now() - this.t0)/1000;
    this.blob = new Blob(this.chunks, {type: this.mr.mimeType || "audio/webm"});
    if(this.url) URL.revokeObjectURL(this.url);
    this.url = URL.createObjectURL(this.blob);

    RECORDINGS.push({
      session: State.session ? State.session.id : "-",
      seconds: +this.secs.toFixed(1),
      type: this.blob.type,
      blob: this.blob,
      url: this.url
    });
    Log.event("recording_made", this.secs.toFixed(1) + "s");

    this.releaseMic();
    if(!root || !document.body.contains(root)) return;
    $("#recstage", root).hidden = true;
    const rev = $("#recreview", root);
    rev.hidden = false;
    $("#recplay", root).src = this.url;
  },

  unsupported(msg){
    const root = this.root;
    const note = $("#recfallback", root);
    $("#recstage", root).hidden = true;
    note.hidden = false;
    note.innerHTML = esc(msg) + " You can write your Echo instead.";
    if(!$("#recwrite", root)){
      note.insertAdjacentHTML("afterend",
        '<div class="btnrow center"><button class="btn" id="recwrite" data-act="go" data-val="WRITE">Write it instead &rarr;</button></div>');
    }
    State.draft.format = "write";
    Log.set("echo_format", "write_after_record_failed");
  },

  releaseMic(){
    if(this.stream){ this.stream.getTracks().forEach(t => t.stop()); this.stream = null; }
    if(this.ac){ try{ this.ac.close(); }catch(e){} this.ac = null; }
    this.analyser = null;
  },

  reset(){
    this.chunks = []; this.blob = null; this.secs = 0; this.history = [];
    const root = this.root;
    if(!root) return;
    const btn = $("#recbtn", root);
    if(btn){
      btn.classList.remove("live");
      btn.querySelector(".glyph").innerHTML = "&#9679;";
      $("#reclabel", root).textContent = "Record";
    }
    const t = $("#rectime", root); if(t){ t.hidden = true; t.textContent = "0:00"; }
    const l = $("#reclevel", root); if(l) l.hidden = true;
    const h = $("#rechint", root); if(h) h.textContent = "Tap to start. Up to 60 seconds — a sentence or two is plenty.";
  },

  teardown(){
    this.stop();
    this.releaseMic();
    this.root = null;
  }
};

function downloadRecordings(){
  RECORDINGS.forEach((r, i) => {
    const ext = /mp4/.test(r.type) ? "m4a" : /ogg/.test(r.type) ? "ogg" : "webm";
    const a = document.createElement("a");
    a.href = r.url;
    a.download = "echo-voice-" + r.session + "-" + (i+1) + "." + ext;
    document.body.appendChild(a);
    setTimeout(() => { a.click(); a.remove(); }, i * 350);
  });
}

function resample(arr, n){
  const out = [];
  for(let i = 0; i < n; i++){
    const a = Math.floor(i*arr.length/n);
    const b = Math.max(a+1, Math.floor((i+1)*arr.length/n));
    let m = 0;
    for(let j = a; j < b && j < arr.length; j++) if(arr[j] > m) m = arr[j];
    out.push(m);
  }
  return out;
}

function toggleTranscript(force){
  const p = $("#transcript");
  if(!p) return;
  const open = force !== undefined ? force : !p.classList.contains("open");
  p.classList.toggle("open", open);
  p.setAttribute("aria-hidden", open ? "false" : "true");
  const scr = p.closest(".screen");
  if(scr) scr.classList.toggle("tr-open", open);
  Log.event(open ? "transcript_open" : "transcript_close");
  if(open){
    const t = $("#transport");
    if(t) t.classList.remove("idle");
  }
}

/* Top-edge hotspot: three taps within 1.5s, or a 1.2s press-and-hold. */
(function(){
  const hot = $("#devhot");
  let taps = [], t0 = 0, hold = null;
  hot.addEventListener("click", () => {
    const now = Date.now();
    if(now - t0 > 1500) taps = [];
    t0 = now; taps.push(now);
    if(taps.length >= 3){ taps = []; Dev.toggle(); }
  });
  hot.addEventListener("pointerdown", () => {
    hold = setTimeout(() => { taps = []; Results.open(); }, 1200);
  });
  ["pointerup","pointerleave","pointercancel"].forEach(ev =>
    hot.addEventListener(ev, () => clearTimeout(hold)));
})();

function teamStatus(text){return '<p class="teamstatus" role="status" aria-live="polite">'+text+'</p>';}
function teamPad(i,label){return '<button class="holdpad role'+i+'" data-pad="'+i+'" aria-label="Participant '+(i?'B':'A')+': '+label+'">'+label+'<small>Hold here · '+(i?'B / L key':'A / A key')+'</small></button>';}
/* Pointer IDs or two distinct keyboard keys must remain down together.
   Mouse clicks cannot bank readiness. Blur/visibility/cancel always clear it. */
function simultaneous(root,onDone){
 const held=new Map();let start=0,finished=false;
 const pads=[...root.querySelectorAll('[data-pad]')], meter=root.querySelector('progress');
 const status=root.querySelector('.syncstatus');
 function clear(){held.clear();start=0;pads.forEach(p=>p.classList.remove('holding'));if(meter)meter.value=0;}
 function release(id){held.delete(id);if(held.size<2){start=0;if(meter)meter.value=0;}paint();}
 function paint(){pads.forEach((p,i)=>p.classList.toggle('holding',[...held.values()].includes(i)));}
 pads.forEach((p,i)=>{p.addEventListener('pointerdown',e=>{if(e.button!==0||finished)return;e.preventDefault();p.setPointerCapture(e.pointerId);held.set('p'+e.pointerId,i);paint();});
 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>p.addEventListener(ev,e=>release('p'+e.pointerId)));});
 const keys={a:0,l:1};
 function down(e){const k=e.key.toLowerCase();if(keys[k]===undefined||e.repeat||finished||e.target.matches('input,textarea'))return;e.preventDefault();held.set('k'+k,keys[k]);paint();}
 function up(e){release('k'+e.key.toLowerCase());}
 document.addEventListener('keydown',down);document.addEventListener('keyup',up);
 window.addEventListener('blur',clear);document.addEventListener('visibilitychange',clear);
 const timer=setInterval(()=>{if(finished)return;const both=[...held.values()].includes(0)&&[...held.values()].includes(1);
 if(!both){start=0;status.textContent='Waiting for both participants to hold their controls.';return;}
 if(!start)start=performance.now();const elapsed=performance.now()-start;meter.value=Math.min(100,elapsed/20);
 status.textContent='Together… '+Math.min(2,elapsed/1000).toFixed(1)+' / 2 seconds';
 if(elapsed>=2000){finished=true;clear();onDone();}},50);
 root._teamCleanup=()=>{clearInterval(timer);document.removeEventListener('keydown',down);document.removeEventListener('keyup',up);window.removeEventListener('blur',clear);document.removeEventListener('visibilitychange',clear);};
}
SCREENS.LANDING={
 render(){return teamHeader('Two voices · One shared story','History opens together','Invite someone beside you. Each person takes a role, shares a different clue and helps create an Echo for the next students.')+
 teamColumns([0,1].map(i=>'<h2>Take your place</h2><p>Introduce yourself and ask your partner what they already know about UQ.</p><button class="btn join" data-join="'+i+'" aria-pressed="false">Join as '+(i?'B':'A')+'</button>'))+
 teamStatus('Waiting for Participant A and Participant B.')+'<button class="btn" id="teamstart" disabled>Open our story →</button><p class="fine">2+ people · Around 6–8 minutes · One shared touchscreen or keyboard<br>More people? Form two groups and rotate the controls after every chapter.</p></div>';},
 mount(root){Team.fresh();root.querySelectorAll('[data-join]').forEach(b=>b.onclick=()=>{const i=+b.dataset.join;Team.joined[i]=!Team.joined[i];b.setAttribute('aria-pressed',Team.joined[i]);b.textContent=Team.joined[i]?'Joined · '+(i?'B':'A'):'Join as '+(i?'B':'A');root.querySelector('#teamstart').disabled=!Team.joined.every(Boolean);root.querySelector('.teamstatus').textContent=Team.joined.every(Boolean)?'Both roles joined. Now open the story together.':'Waiting for both participants.';});root.querySelector('#teamstart').onclick=()=>{if(Team.joined.every(Boolean)){Team.record('joined','A+B');go('TEAM_OPEN');}};}
};
SCREENS.TEAM_OPEN={
 render(){return teamHeader('01 / 04 · Open together','Two hands, one beginning','Each person holds their own control for two seconds at the same time. Releasing either control resets the hold.')+'<div class="syncpads">'+teamPad(0,'I’m here with my partner')+teamPad(1,'I’m here with my partner')+'</div><progress max="100" value="0" aria-label="Together hold progress"></progress><p class="syncstatus teamstatus" role="status">Waiting for both participants.</p><p class="fine">Touchscreen: use two simultaneous touches. Keyboard: A holds A; B holds L. A mouse alone cannot complete this step.</p></div>';},
 mount(root){simultaneous(root,()=>{Team.opened=true;Team.record('opened','simultaneous 2s');go('TEAM_CLUES');});},unmount(root){root._teamCleanup?.();}
};
SCREENS.TEAM_CLUES={
 render(){const c=TEAM_CHAPTERS[Team.round];return teamHeader('02 / 04 · Chapter '+(Team.round+1)+' of 3',c.title,'One clue each. Read yours, explain it in your own words, then listen to your partner. Swap who explains first each round.')+teamColumns([0,1].map(i=>'<button class="btn ghost" data-reveal="'+i+'">Read my clue</button><p class="cluetext" hidden></p><button class="btn small explain" data-explain="'+i+'" disabled>I explained it to my partner</button>'))+teamStatus('Both people must share their clue before answering.')+'<button class="btn" id="cluenext" disabled>Combine our clues →</button></div>';},
 mount(root){Team.reveal=[false,false];const explained=[false,false];root.querySelectorAll('[data-reveal]').forEach(b=>b.onclick=()=>{const i=+b.dataset.reveal;Team.reveal[i]=true;const p=b.nextElementSibling;p.hidden=false;p.textContent=TEAM_CHAPTERS[Team.round][i?'b':'a'];b.textContent='My clue is open';root.querySelector('[data-explain="'+i+'"]').disabled=false;Team.record('clue_read',Team.round+':'+i);});root.querySelectorAll('[data-explain]').forEach(b=>b.onclick=()=>{const i=+b.dataset.explain;if(!Team.reveal[i])return;explained[i]=true;b.textContent='Shared ✓';b.disabled=true;root.querySelector('#cluenext').disabled=!explained.every(Boolean);});root.querySelector('#cluenext').onclick=()=>{if(explained.every(Boolean)){Team.confirmed=[true,true];go('TEAM_ANSWER');}};}
};
SCREENS.TEAM_ANSWER={
 render(){const c=TEAM_CHAPTERS[Team.round];return teamHeader('02 / 04 · Decide together',c.q,'A and B each choose an answer. Different answers? Discuss the clues and revise. You can only submit when you agree.')+teamColumns([0,1].map(i=>c.options.map((o,n)=>'<button class="choice vote" data-voter="'+i+'" data-option="'+n+'" aria-pressed="false">'+esc(o)+'</button>').join('')))+teamStatus('Waiting for both answers.')+'<button class="btn" id="answersubmit" disabled>Check our answer</button></div>';},
 mount(root){Team.votes=[null,null];root.querySelectorAll('.vote').forEach(b=>b.onclick=()=>{const i=+b.dataset.voter;Team.votes[i]=+b.dataset.option;root.querySelectorAll('[data-voter="'+i+'"]').forEach(x=>{const sel=x===b;x.classList.toggle('selected',sel);x.setAttribute('aria-pressed',sel);});const both=Team.votes.every(v=>v!==null),same=Team.votes[0]===Team.votes[1];root.querySelector('#answersubmit').disabled=!(both&&same);root.querySelector('.teamstatus').textContent=!both?'Waiting for the other person.':same?'You agree. Check your reasoning together.':'Different answers. Explain which clue supports your choice.';});root.querySelector('#answersubmit').onclick=()=>{if(Team.votes.some(v=>v===null)||Team.votes[0]!==Team.votes[1])return;Team.record('answer',{round:Team.round,votes:Team.votes.slice(),correct:Team.votes[0]===TEAM_CHAPTERS[Team.round].answer});if(Team.votes[0]!==TEAM_CHAPTERS[Team.round].answer){root.querySelector('.teamstatus').textContent='Not yet. '+TEAM_CHAPTERS[Team.round].lesson+' Discuss, then both choose again.';Team.votes=[null,null];root.querySelectorAll('.vote').forEach(b=>{b.classList.remove('selected');b.setAttribute('aria-pressed','false');});root.querySelector('#answersubmit').disabled=true;return;}Team.solved=Team.round+1;go('TEAM_LEARN');};}
};
SCREENS.TEAM_LEARN={
 render(){const c=TEAM_CHAPTERS[Team.round];return teamHeader('Chapter unlocked · '+(Team.round+1)+' / 3','You pieced it together',esc(c.lesson))+'<div class="teamcard"><p class="rolelabel">Pause and talk</p><h2>'+esc(c.prompt)+'</h2><p>Each person offers one thought. You do not need to agree.</p><a href="'+TEAM_SOURCE+'" target="_blank" rel="noopener">Explore the UQ historical account ↗</a></div>'+teamColumns([0,1].map(i=>'<button class="btn ghost" data-talk="'+i+'">'+(i?'B':'A')+' · I shared my thought</button>'))+teamStatus('Both voices before the next chapter.')+'<button class="btn" id="learnnext" disabled>'+(Team.round<2?'Next chapter →':'Create our Echo →')+'</button></div>';},
 mount(root){const spoken=[false,false];root.querySelectorAll('[data-talk]').forEach(b=>b.onclick=()=>{spoken[+b.dataset.talk]=true;b.textContent='Shared ✓';b.disabled=true;root.querySelector('#learnnext').disabled=!spoken.every(Boolean);});root.querySelector('#learnnext').onclick=()=>{if(!spoken.every(Boolean))return;Team.record('discussion',Team.round);if(Team.round<2){Team.round++;Team.confirmed=[false,false];go('TEAM_CLUES');}else go('TEAM_MAKE');};}
};
SCREENS.TEAM_MAKE={
 render(){return teamHeader('03 / 04 · Make something together','A poster with two voices','Inspired by UQ’s history of collective action, create a poster welcoming a new student. A draws a symbol; B connects or adds to it. Each writes a line explaining what your poster means.')+'<div class="teamcard"><p class="rolelabel">History anchor</p><p>1967: UQ students and staff marched together for civil liberties. Your poster is a present-day response, not a historical artefact.</p></div>'+teamColumns([0,1].map(i=>'<label class="rolelabel" for="word'+i+'">'+(i?'B · Connect it to belonging today':'A · Connect it to something you learned')+'</label><textarea id="word'+i+'" maxlength="180" rows="2" placeholder="Your own sentence…"></textarea><div class="drawing"><canvas id="draw'+i+'" width="600" height="240" aria-label="Participant '+(i?'B':'A')+' drawing area"></canvas></div><button class="btn small ghost" data-clear="'+i+'">Clear my drawing</button><button class="btn small ghost" data-symbol="'+i+'">Add a '+(i?'connecting circle':'solidarity star')+' instead</button>'))+teamStatus('Each participant contributes a drawing (or symbol) and a sentence.')+'<button class="btn" id="makenext" disabled>Review our shared poster →</button><p class="fine">Drawing is optional: use the symbol button with touch, mouse or keyboard. Nothing is uploaded or shared publicly.</p></div>';},
 mount(root){const update=()=>{root.querySelector('#makenext').disabled=!(Team.words.every(w=>w.trim().length>=5)&&Team.strokes.every(s=>s.length>0));};[0,1].forEach(i=>{const ta=root.querySelector('#word'+i);ta.value=Team.words[i];ta.oninput=()=>{Team.words[i]=ta.value;update();};const cv=root.querySelector('#draw'+i),ctx=cv.getContext('2d');let stroke=null;
 function paint(){ctx.clearRect(0,0,600,240);ctx.strokeStyle=i?'#226B69':'#6E1C20';ctx.lineWidth=5;ctx.lineCap='round';Team.strokes[i].forEach(points=>{ctx.beginPath();points.forEach((p,n)=>n?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();});}
 function point(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*240/r.height];}
 cv.onpointerdown=e=>{if(e.button!==0||stroke)return;e.preventDefault();cv.setPointerCapture(e.pointerId);stroke={id:e.pointerId,points:[point(e)]};};cv.onpointermove=e=>{if(!stroke||stroke.id!==e.pointerId)return;stroke.points.push(point(e));paint();ctx.beginPath();stroke.points.forEach((p,n)=>n?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();};cv.onpointerup=e=>{if(!stroke||stroke.id!==e.pointerId)return;if(stroke.points.length>=2)Team.strokes[i].push(stroke.points);stroke=null;paint();update();};cv.onpointercancel=()=>{stroke=null;paint();};
 root.querySelector('[data-clear="'+i+'"]').onclick=()=>{Team.strokes[i]=[];paint();update();};root.querySelector('[data-symbol="'+i+'"]').onclick=()=>{const pts=[];for(let n=0;n<=40;n++){const a=n/40*Math.PI*2;const radius=i?65:(n%8<4?65:30);pts.push([300+Math.cos(a)*radius,120+Math.sin(a)*radius]);}Team.strokes[i].push(pts);paint();update();};paint();});update();root.querySelector('#makenext').onclick=()=>{if(Team.words.every(w=>w.trim().length>=5)&&Team.strokes.every(s=>s.length)){Team.approvals=[false,false];go('TEAM_REVIEW');}};}
};
function posterSVG(){return '<svg viewBox="0 0 1200 500" role="img" aria-label="Our poster: maroon and teal contributions"><rect width="1200" height="500" fill="#F7EDD8"/>'+Team.strokes.map((ss,i)=>ss.map(ps=>'<polyline transform="translate('+(i*600)+',0)" points="'+ps.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="'+(i?'#226B69':'#6E1C20')+'" stroke-width="5" stroke-linecap="round"/>').join('')).join('')+'<path d="M540 250 Q600 200 660 250" stroke="#C99B74" stroke-width="4" fill="none"/><text x="600" y="310" text-anchor="middle" font-family="Georgia" font-size="40" fill="#221C17">Two voices. One campus.</text><text x="600" y="370" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#5A4C42">1967 · Collective action for civil liberties</text></svg>';}
SCREENS.TEAM_REVIEW={
 render(){return teamHeader('04 / 04 · Remember, then agree','Our Echo','Before you leave it, each person answers a different recall question and approves the shared poster.')+'<div class="poster">'+posterSVG()+'</div>'+teamColumns([0,1].map(i=>'<p>'+esc(Team.words[i])+'</p><label for="recall'+i+'">'+(i?'What did the march defend?':'Which year was the march?')+'</label><select id="recall'+i+'"><option value="">Choose from memory</option>'+(i?'<option value="wrong">A sporting result</option><option value="right">Civil liberties</option>':'<option value="wrong">1985</option><option value="right">1967</option>')+'</select><button class="btn small ghost" data-approve="'+i+'" disabled>Approve my contribution</button>'))+teamStatus('Both recall answers and both approvals are needed.')+'<button class="btn" id="publishteam" disabled>Seal our Echo together →</button><button class="btn ghost" id="editteam">Edit poster</button></div>';},
 mount(root){Team.approvals=[false,false];Team.recall=[null,null];root.querySelectorAll('select').forEach((s,i)=>s.onchange=()=>{Team.recall[i]=s.value;Team.approvals[i]=false;const b=root.querySelector('[data-approve="'+i+'"]');b.disabled=s.value!=='right';b.textContent='Approve my contribution';root.querySelector('#publishteam').disabled=true;if(s.value==='wrong')root.querySelector('.teamstatus').textContent='Remember: the 1967 march defended civil liberties. Try again.';});root.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>{const i=+b.dataset.approve;if(Team.recall[i]!=='right')return;Team.approvals[i]=true;b.textContent='Approved ✓';b.disabled=true;root.querySelector('#publishteam').disabled=!Team.approvals.every(Boolean);});root.querySelector('#editteam').onclick=()=>go('TEAM_MAKE');root.querySelector('#publishteam').onclick=()=>{if(Team.approvals.every(Boolean)&&Team.recall.every(v=>v==='right'))go('TEAM_SEAL');};}
};
SCREENS.TEAM_SEAL={render(){return teamHeader('04 / 04 · Seal together','Leave a shared trace','Hold both controls together once more to seal your poster and reflections.')+'<div class="syncpads">'+teamPad(0,'Seal my contribution')+teamPad(1,'Seal my contribution')+'</div><progress max="100" value="0" aria-label="Seal progress"></progress><p class="syncstatus teamstatus" role="status">Waiting for both participants.</p></div>';},mount(root){simultaneous(root,()=>{Team.done=true;Log.set('team_words',Team.words.slice());Log.set('team_strokes',Team.strokes);Team.record('complete','Both roles, 3 chapters, recall and joint poster');go('TEAM_DONE');});},unmount(root){root._teamCleanup?.();}};
SCREENS.TEAM_DONE={render(){return teamHeader('Together · Story unlocked','You made an Echo','Three stories explored, two voices heard, one shared poster. Ask your partner: what will you notice differently on campus now?')+'<div class="poster">'+posterSVG()+'</div>'+teamColumns(Team.words.map(w=>'<p>'+esc(w)+'</p>'))+'<div class="btnrow"><button class="btn" id="saveposter">Download our poster</button><button class="btn ghost" data-act="go" data-val="CHOOSE_ACTION">Explore original Echo stories →</button><button class="btn ghost" data-act="restart-hard">Invite the next team</button></div><p class="fine">Saved on this browser only. Download a copy to keep it. Original story media still needs the supplied media folder.</p></div>';},mount(root){root.querySelector('#saveposter').onclick=()=>{const svg=posterSVG().replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" ');const html='<!doctype html><meta charset="utf-8"><title>Our ECHO poster</title><style>body{max-width:900px;margin:40px auto;padding:24px;background:#F4E6CB;color:#221C17;font:20px Georgia}svg{width:100%}</style>'+svg+'<p><b>A:</b> '+esc(Team.words[0])+'</p><p><b>B:</b> '+esc(Team.words[1])+'</p><p>Contemporary response to UQ history · '+new Date().toLocaleDateString('en-AU')+'</p><p>Source: <a href="'+TEAM_SOURCE+'">UQ: From little things big things grow</a></p>';const url=URL.createObjectURL(new Blob([html],{type:'text/html'}));const a=document.createElement('a');a.href=url;a.download='our-echo-poster.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);};}};

Store.read();
Log.begin();
go("LANDING");

/* Three ways into the responses, so it is never a hunt:
   1. add #responses to the address and reload  (bookmark this)
   2. Ctrl/Cmd + Shift + D  → tester panel → View all responses
   3. triple-tap the middle of the very top edge of the screen
   None of them are visible to a participant. */
function openIfRequested(){
  const h = (location.hash || "").toLowerCase();
  if(h === "#responses" || h === "#data" || h === "#results") Results.open();
}
openIfRequested();
window.addEventListener("hashchange", openIfRequested);

window.addEventListener("beforeunload", () => { Player.bankProgress(); Log.commit(); });
document.addEventListener("visibilitychange", () => {
  if(document.hidden){ Player.bankProgress(); Log.commit(); }
});
</script>
</body>
</html>
